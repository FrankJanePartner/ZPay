[package]
name = "zoerd-wallet"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "zoerd_wallet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

zcash_client_backend = { version = "0.24.0", features = ["lightwalletd-tonic-transport", "sync"] }
zcash_client_sqlite = "0.22.0"
zcash_keys = "0.16.1"
zcash_protocol = "0.10.5"
zip32 = "0.2.1"
rand = "0.8.5"

tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

bip39 = { version = "2.2.2", features = ["rand", "zeroize"] }
secrecy = "0.8"
async-trait = "0.1"
tauri-plugin-secure-storage = "1.5.0"
zcash_proofs = { version = "0.30.0", features = ["local-prover"] }
zip321 = "0.9.0"
zcash_address = "0.13.0"
zcash_primitives = "0.30.1"
