name: Frontend checks
on:
  push:
    branches: [main, 'audit/**']
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # A lockfile is not yet committed; use install until one is generated and reviewed.
      - run: npm install --no-package-lock
      - run: npm run build
