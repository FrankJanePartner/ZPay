name: Wallet service checks
on:
  push:
    branches: [main, feat/payment-api]
    paths: ["wallet-service/**", "src-tauri/src/wallet/**", ".github/workflows/wallet.yml"]
  pull_request:
    paths: ["wallet-service/**", "src-tauri/src/wallet/**", ".github/workflows/wallet.yml"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: wallet-service
      - run: cargo test --locked --manifest-path wallet-service/Cargo.toml --lib
      - run: cargo build --locked --manifest-path wallet-service/Cargo.toml
