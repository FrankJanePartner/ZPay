[package]
name = "zpay-wallet-service"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zcash_client_backend = { version = "=0.24.0", features = ["lightwalletd-tonic-transport", "sync"] }
zcash_client_sqlite = "=0.22.0"
zcash_keys = "=0.16.1"
zcash_protocol = "=0.10.5"
zip32 = "=0.2.1"
zcash_address = "=0.13.0"
rand = "0.8.5"
bip39 = { version = "2.2.2", features = ["rand", "zeroize"] }
secrecy = "0.8"
async-trait = "0.1"
chacha20poly1305 = "0.10"
hex = "0.4"
fs2 = "0.4"
tempfile = "3"
uuid = { version = "1", features = ["serde", "v4"] }
subtle = "2"
zeroize = "1"

